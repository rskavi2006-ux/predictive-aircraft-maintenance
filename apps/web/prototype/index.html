<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AeroGuard (prototype)</title>
<style>
:root{--teal:#028090;--dark:#1B2A2E;--light:#F4FAF9;--bd:#D7E7E5;--red:#D64545;--amb:#E0A526;--grn:#2E9E6B;--gry:#9AAAA7}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;color:var(--dark);background:#fff}
.banner{background:#FFF4D6;color:#6b5200;text-align:center;font-size:13px;padding:5px}
header{background:var(--teal);color:#fff;display:flex;align-items:center;gap:24px;padding:12px 28px}
header b{font-size:20px;font-family:Cambria,serif}nav a{color:#d7f1ee;margin-right:16px;padding:6px 2px;cursor:pointer}nav a.on{color:#fff;border-bottom:2px solid #fff}
.sp{flex:1}.pill{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:12px;font-size:13px}
main{max-width:1100px;margin:24px auto;padding:0 20px}h2{font-family:Cambria,serif;margin:0 0 6px}h3{font-family:Cambria,serif;margin:18px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.tile{border-radius:8px;color:#fff;padding:10px;font-weight:bold}.tile small{display:block;font-weight:normal}
.card{background:var(--light);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.live,.mock{font-size:11px;border-radius:8px;padding:2px 7px;color:#fff;vertical-align:middle}.live{background:var(--grn)}.mock{background:var(--gry)}
.badge{color:#fff;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:bold}
button{border:0;border-radius:6px;padding:7px 14px;color:#fff;font-weight:bold;cursor:pointer;background:var(--teal)}button.r{background:#7A8F8C}button.d{background:var(--amb)}button:disabled{opacity:.4;cursor:not-allowed}
textarea,input,select{width:100%;border:1px solid var(--bd);border-radius:6px;padding:8px;font:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--teal);color:#fff;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid var(--bd)}
.f{flex:1;min-width:130px}.f label{font-size:12px;color:#5d716e}
.stat{flex:1;min-width:150px;text-align:center;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px}.stat b{display:block;font-size:28px;color:var(--teal)}
.bar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:8px 0;gap:2px}.bar div{color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.muted{color:#5d716e;font-size:13px}.login{max-width:340px;margin:50px auto}.login label{display:block;margin:12px 0 4px;font-weight:bold}.err{color:var(--red);font-size:13px;margin-top:8px}
</style></head><body>
<div class="banner">Prototype. Login, fleet, aircraft detail, admin and simulation use the live API. Alerts and Plan use mock data.</div>
<div id="app"></div>
<script>
const API='http://localhost:4000/api/v1';
let user=null,token=null,tab='fleet',confirmed=false,ac=null;
const el=i=>document.getElementById(i);
async function api(path,o={}){
  const h={'content-type':'application/json'};
  if(o.auth!==false&&token)h.authorization='Bearer '+token;
  const r=await fetch(API+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch{j=t}
  if(!r.ok)throw new Error((j&&j.error&&j.error.message)||('HTTP '+r.status));
  return j}
const col=h=>h==null?'var(--gry)':h<25?'var(--red)':h<70?'var(--amb)':'var(--grn)';
const num=(v,d=0)=>typeof v==='number'?v.toFixed(d):'-';
const list=r=>Array.isArray(r)?r:(r&&(r.data||r.users||r.items))||[];
async function login(){
  try{const r=await api('/auth/login',{method:'POST',auth:false,body:{email:el('em').value,password:el('pw').value}});
    token=r.accessToken||r.token;if(!token)throw new Error('No token in response. Keys: '+Object.keys(r).join(', '));
    user=r.user||{email:el('em').value,role:'?'};tab='fleet';draw()}
  catch(x){el('err').textContent='Login failed: '+x.message+' (is the API running on port 4000?)'}}
async function loadFleet(){
  try{const r=await api('/health-scores/fleet');
    const f=r.data.filter(x=>x.registration).sort((a,b)=>a.registration.localeCompare(b.registration));
    el('sum').textContent=f.length?`${f.length} aircraft scored, ${f.filter(x=>x.minHealth<70).length} need attention. Click a tile for details.`:'No scores yet. Run the simulation below.';
    el('grid').innerHTML=f.map(x=>`<div class="tile" style="background:${col(x.minHealth)};cursor:pointer" onclick="openAircraft('${x.aircraftId}','${x.registration}')">${x.registration}<small>health ${Math.round(x.minHealth)}</small><small>at risk: ${x.atRisk}</small></div>`).join('')}
  catch(x){el('sum').textContent='Could not load fleet: '+x.message}}
function openAircraft(id,reg){ac={id,reg};go('aircraft')}
function detailView(){return `<h2>${ac?ac.reg:'Aircraft detail'} <span class="live">LIVE API</span></h2><div class="muted">Component health from the rule-based prediction service. All data is simulated.</div><div id="det" style="margin-top:12px"></div>`}
async function loadDetail(){const b=el('det');
  if(!ac){b.innerHTML='<p class="muted">Pick an aircraft tile on the Fleet tab first.</p>';return}
  try{const rows=list(await api('/health-scores/aircraft/'+ac.id));
    if(!rows.length){b.innerHTML='<p class="muted">No scores for this aircraft yet.</p>';return}
    const hv=s=>s.health??s.healthScore??s.score;
    const p=s=>typeof s.failureProbability==='number'?Math.round(s.failureProbability*100)+'%':'-';
    b.innerHTML='<table><tr><th>Component</th><th>Health</th><th>Failure probability</th><th>Days left (RUL)</th></tr>'+
      rows.map(s=>`<tr><td>${s.name||'-'}</td><td><span class="badge" style="background:${col(hv(s))}">${num(hv(s))}</span></td><td>${p(s)}</td><td>${num(s.rulDays,1)}</td></tr>`).join('')+'</table>'+
      (hv(rows[0])===undefined?`<p class="muted">Fields returned: ${Object.keys(rows[0]).join(', ')}</p>`:'')}
  catch(x){b.innerHTML='<p class="err">Could not load: '+x.message+'</p>'}}
function adminView(){return `<h2>Admin panel <span class="live">LIVE API</span></h2><div class="muted">Users are Admin-only. The audit log is visible to Admin and Auditor. The log is append-only.</div>
 ${user.role==='ADMIN'?'<h3>Users</h3><div id="usr" class="muted">Loading...</div>':''}<h3>Audit log (latest)</h3><div id="aud" class="muted">Loading...</div>`}
async function loadAdmin(){
  if(user.role==='ADMIN'){try{const u=list(await api('/users'));
    el('usr').innerHTML='<table><tr><th>Email</th><th>Role</th><th>Licence</th><th>Active</th></tr>'+u.map(x=>`<tr><td>${x.email||'-'}</td><td>${x.role||'-'}</td><td>${x.licenseCategory||'-'}</td><td>${x.active===false?'No':'Yes'}</td></tr>`).join('')+'</table>'}
    catch(x){el('usr').innerHTML='<span class="err">'+x.message+'</span>'}}
  try{let a=list(await api('/audit'));a=a.sort((p,q)=>String(q.createdAt||q.timestamp||'').localeCompare(String(p.createdAt||p.timestamp||''))).slice(0,12);
    el('aud').innerHTML=a.length?'<table><tr><th>Time</th><th>Action</th><th>Role</th><th>Entity</th></tr>'+a.map(x=>`<tr><td>${String(x.createdAt||x.timestamp||'').replace('T',' ').slice(0,19)}</td><td>${x.action||'-'}</td><td>${x.actorRole||'-'}</td><td>${x.entityType||'-'}</td></tr>`).join('')+'</table>':'No entries yet.'}
  catch(x){el('aud').innerHTML='<span class="err">'+x.message+'</span>'}}
const noise=a=>(Math.random()*2-1)*a,rnd=x=>Math.round(x*100)/100;
function reading(kind,i,total){let egt=600+noise(3),vib=2+noise(.06),oilP=50+noise(.6),oilT=90+noise(1);
  if(kind==='drift'){vib+=.02*i;egt+=.5*i;oilT+=.08*i;oilP-=.04*i}
  if(kind==='spike'&&i>=total-8){vib+=3.2;egt+=50}
  return{egt:rnd(egt),vibration:rnd(vib),oilPressure:rnd(oilP),oilTemp:rnd(oilT)}}
async function runSim(){
  const m=el('simmsg'),b=el('simbtn');b.disabled=true;
  try{const tk=el('st').value.trim(),n=+el('sa').value,hrs=+el('sh').value;
    if(!tk)throw new Error('Enter the service token (SERVICE_TOKEN in .env)');
    if(!(n>=1)||!(hrs>=10))throw new Error('Aircraft must be 1 or more, hours 10 or more');
    const sc=new Map();for(const it of el('sf').value.split(',').filter(Boolean)){const [r,nm,k]=it.split(':');
      if(!r||!nm||(k!=='drift'&&k!=='spike'))throw new Error('Bad scenario "'+it+'". Use registration:component:drift|spike');sc.set(r+'|'+nm,k)}
    m.textContent='Loading targets...';
    const tr=await fetch(API+'/telemetry/targets',{headers:{'x-service-token':tk}});
    if(!tr.ok)throw new Error('Targets failed: HTTP '+tr.status+' (wrong service token?)');
    const {targets}=await tr.json();
    const regs=[...new Set(targets.map(t=>t.registration).filter(Boolean))].sort().slice(0,n);
    const chosen=targets.filter(t=>t.registration&&regs.includes(t.registration));
    const base=Math.floor(Date.now()/3600000)*3600000-(hrs-1)*3600000;
    let batch=[],ins=0,dup=0;
    const flush=async()=>{if(!batch.length)return;m.textContent='Sending '+batch.length+' readings...';
      const r=await fetch(API+'/telemetry/batch',{method:'POST',headers:{'content-type':'application/json','x-service-token':tk},body:JSON.stringify({readings:batch})});
      if(!r.ok)throw new Error('Ingest failed: HTTP '+r.status+' '+await r.text());
      const j=await r.json();ins+=j.inserted;dup+=j.duplicates;batch=[]};
    for(let i=0;i<hrs;i++)for(const t of chosen){
      batch.push({componentId:t.componentId,timestamp:new Date(base+i*3600000).toISOString(),...reading(sc.get(t.registration+'|'+t.name),i,hrs)});
      if(batch.length>=800)await flush()}
    await flush();m.textContent=`Done: ${ins} inserted, ${dup} duplicates ignored.`;await loadFleet()}
  catch(x){m.textContent='Error: '+x.message}
  b.disabled=false}
function fleetView(){return `<h2>Fleet health <span class="live">LIVE API</span></h2><div id="sum" class="muted">Loading...</div><div class="grid" id="grid"></div>
 <div class="card" style="margin-top:18px"><b>Run simulation</b> <span class="muted">Demo only. Same scenarios as the CLI simulator. All data is simulated.</span>
 <div class="row" style="margin-top:8px"><div class="f"><label>Service token</label><input id="st" type="password" placeholder="SERVICE_TOKEN from .env"></div>
 <div class="f" style="max-width:90px"><label>Aircraft</label><input id="sa" value="5"></div><div class="f" style="max-width:90px"><label>Hours</label><input id="sh" value="120"></div>
 <div class="f" style="flex:3"><label>Failures (registration:component:drift|spike)</label><input id="sf" value="VT-AG02:Engine 1:drift,VT-AG04:Hydraulic Pump:drift,VT-AG03:APU:spike"></div></div><br>
 <button id="simbtn" onclick="runSim()">Run scenario</button> <span id="simmsg" class="muted"></span></div>`}
const alerts=[{id:1,reg:'VT-AG03',comp:'APU',h:20,p:'AOG_RISK',rul:2,why:'Temperature trend rising, spike detected',st:'OPEN',note:''},
 {id:2,reg:'VT-AG02',comp:'Engine 1',h:41,p:'HIGH',rul:9,why:'Vibration drifting above threshold',st:'OPEN',note:''},
 {id:3,reg:'VT-AG04',comp:'Hydraulic Pump',h:40,p:'HIGH',rul:10,why:'Pressure trend falling',st:'OPEN',note:''}];
const tasks=[{reg:'VT-AG03',n:'APU',d:3},{reg:'VT-AG03',n:'Fuel pump',d:3},{reg:'VT-AG02',n:'Engine 1',d:3}],OH=2;
const pc={AOG_RISK:'var(--red)',HIGH:'var(--amb)'};
function decide(id,act){const a=alerts.find(x=>x.id===id),n=el('n'+id).value.trim();if(n.length<3){alert('A note of at least 3 characters is required.');return}a.st=act;a.note=n;draw()}
function alertsView(){const eng=user.role==='ENGINEER';
 return `<h2>Alert queue <span class="mock">MOCK</span></h2><div class="muted">${eng?'Add a note, then decide.':'Read-only: only an Engineer can decide alerts.'}</div><br>`+alerts.map(a=>`
 <div class="card"><div class="row"><span class="badge" style="background:${pc[a.p]}">${a.p}</span><b>${a.reg} / ${a.comp}</b><span class="muted">health ${a.h}, about ${a.rul} days left</span><span class="sp"></span><b>${a.st}</b></div>
 <p class="muted">Why: ${a.why}</p>${a.st==='OPEN'?`<textarea id="n${a.id}" rows="2" placeholder="Decision note (required)" ${eng?'':'disabled'}></textarea><br><br>
 <button ${eng?'':'disabled'} onclick="decide(${a.id},'APPROVED')">Approve</button> <button class="r" ${eng?'':'disabled'} onclick="decide(${a.id},'REJECTED')">Reject</button> <button class="d" ${eng?'':'disabled'} onclick="decide(${a.id},'DEFERRED')">Defer</button>`:`<p class="muted">Note: ${a.note}</p>`}</div>`).join('')}
function planView(){const pl=user.role==='PLANNER',g={};tasks.forEach(t=>(g[t.reg]=g[t.reg]||[]).push(t));
 const sep=tasks.reduce((s,t)=>s+t.d+OH,0),ks=Object.keys(g),bun=tasks.reduce((s,t)=>s+t.d,0)+ks.length*OH;
 return `<h2>Plan preview <span class="mock">MOCK</span></h2><div class="muted">Placeholder durations. Nothing is scheduled until a Planner confirms.</div><br>
 <div class="row"><div class="stat"><b>${sep} h</b>one slot per task</div><div class="stat"><b>${bun} h</b>bundled</div><div class="stat"><b>${sep-bun} h</b>downtime saved</div><div class="stat"><b>0</b>missed due limit</div></div><br>`+
 ks.map(k=>`<div class="card"><b>${k}</b> <span class="muted">one LINE window, overhead ${OH} h</span><div class="bar">${g[k].map(t=>`<div style="flex:${t.d};background:var(--teal)">${t.n} (${t.d} h)</div>`).join('')}<div style="flex:${OH};background:#7A8F8C">overhead</div></div></div>`).join('')+
 `<button ${pl&&!confirmed?'':'disabled'} onclick="confirmed=true;draw()">${confirmed?'Window confirmed':'Confirm window'}</button> ${pl?'':'<span class="muted">Only a Planner can confirm.</span>'}`}
function go(t){tab=t;draw()}
function navItems(){const n=[['fleet','Fleet'],['aircraft','Aircraft'],['alerts','Alerts'],['plan','Plan']];if(user.role==='ADMIN'||user.role==='AUDITOR')n.push(['admin','Admin']);return n}
function views(){return tab==='fleet'?fleetView():tab==='aircraft'?detailView():tab==='alerts'?alertsView():tab==='plan'?planView():adminView()}
function draw(){const app=el('app');
 if(!user){app.innerHTML=`<div class="login card"><h2>AeroGuard</h2><div class="muted">Predict. Plan. Comply.</div><label>Email</label>
  <select id="em">${['admin','planner','auditor','engineer.b1','engineer.b2'].map(e=>`<option>${e}@aeroguard.dev</option>`).join('')}</select>
  <label>Password</label><input id="pw" type="password" value="Passw0rd!demo"><br><br><button onclick="login()" style="width:100%">Sign in</button><div class="err" id="err"></div></div>`;return}
 app.innerHTML=`<header><b>AeroGuard</b><nav>${navItems().map(([k,l])=>`<a class="${tab===k?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}</nav><span class="sp"></span>
  <span class="pill">${user.email} (${user.role})</span><a style="color:#fff;cursor:pointer" onclick="user=null;token=null;ac=null;draw()">Sign out</a></header>
  <main>${views()}</main>`;
 if(tab==='fleet')loadFleet();if(tab==='aircraft')loadDetail();if(tab==='admin')loadAdmin()}
draw();
</script></body></html>
